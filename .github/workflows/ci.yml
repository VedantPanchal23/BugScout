name: BugScout CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Test & Benchmark Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Automated Test Suite (Pytest)
        run: |
          pytest -v

      - name: Verify ScopeGuard Safety Suite
        run: |
          python main.py --safety-test

      - name: Verify Ground-Truth Benchmark Evaluation
        run: |
          python main.py --evaluate

      - name: Verify Cost-Recall Pareto Frontier
        run: |
          python main.py --budget-curve

      - name: Verify Cross-Format Artifact Consistency (SARIF, HTML, JSON, MD)
        run: |
          python main.py --validate-consistency
