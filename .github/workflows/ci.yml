name: BugScout CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Autonomous Security Engine & Benchmark Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Full Test Suite (Unit, Integration, Safety, Boundary)
      run: |
        pytest -v

    - name: Run Primary Benchmark Evaluation
      run: |
        python main.py --evaluate

    - name: Run A/B Baseline Comparison
      run: |
        python main.py --compare-modes

    - name: Run Pareto Budget Curve Analysis
      run: |
        python main.py --budget-curve

    - name: Run 4-Tier Component Ablation
      run: |
        python main.py --ablation

    - name: Run 5-Run Repeated Stability Evaluation
      run: |
        python main.py --repeated-eval

    - name: Run Zero-Shot Hidden Generalization Benchmark
      run: |
        python main.py --hidden-eval

    - name: Run ScopeGuard Ethical Firewall Safety Suite
      run: |
        python main.py --safety-test
