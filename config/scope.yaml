# BugScout Scope Configuration
# Mandatory ethical boundary file for autonomous testing.

target: "http://127.0.0.1:8888"

allowed_hosts:
  - "127.0.0.1"
  - "localhost"

allowed_paths:
  - "/"
  - "/api/*"
  - "/search"
  - "/login"
  - "/debug/*"
  - "/.env"
  - "/robots.txt"
  - "/sitemap.xml"
  - "/openapi.json"
  - "/static/*"
  - "/graphql"
  - "/redirect"
  - "/user/*"
  - "/settings/*"

excluded_test_types:
  - "brute_force"
  - "dos"

# Rate Limiting & Safety Controls
max_requests_per_minute: 200
max_total_requests: 500
max_crawl_depth: 3
allow_localhost_for_testing: true
verify_ssl: true
max_retries: 2
retry_backoff: 0.2
